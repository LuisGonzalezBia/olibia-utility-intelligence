name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # @biaenergy/ui sale del registro de paquetes de la org biaenergy. Este
      # repo esta fuera de esa org, asi que el GITHUB_TOKEN del workflow no
      # alcanza: hace falta un PAT de lectura sobre sus paquetes.
      - name: Instalar dependencias
        env:
          NPM_GITHUB_TOKEN: ${{ secrets.NPM_GITHUB_TOKEN }}
        run: npm ci

      - name: Typecheck
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  # La imagen NO se construye aca: Cactus clona el repo y corre el Dockerfile
  # el mismo. Este workflow existe para que un typecheck roto se vea en el PR y
  # no despues, en un build de la plataforma que tarda varios minutos.
